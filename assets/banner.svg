  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="600">
    <rect x="332" y="222" width="86" height="42" rx="21" fill="#1c4b6b"/><text x="375" y="251" text-anchor="middle" fill="#ffffff">1p</text>
    <rect x="432" y="222" width="86" height="42" rx="21" fill="#1c4b6b"/><text x="475" y="251" text-anchor="middle" fill="#ffffff">3p</text>
    <rect x="532" y="222" width="150" height="42" rx="21" fill="#1c4b6b"/><text x="607" y="251" text-anchor="middle" fill="#ffffff">OCPP 1.6</text>
  </g>
